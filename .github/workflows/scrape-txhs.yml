name: Scrape TX High School Scores

on:
  schedule:
    - cron: '*/5 * * * *' # Runs every 5 minutes
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Puppeteer system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libnspr4 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libdbus-1-3 libxkbcommon0 libX11-6 libXcomposite1 libXdamage1 libXext6 libXfixes6 libXrandr2 libgbm1 libpango-1.0-0 libcairo2

      - name: Install dependencies
        run: npm install

      - name: Run Scraper Script
        run: node scraper.js

      - name: Commit and push if changed
        run: |
          git config --global user.name 'GitHub Actions Bot'
          git config --global user.email 'actions@github.com'
          git add txhs-scores.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update TX HS scores [skip ci]" && git push)
