name: Scrape TX High School Scores

on:
  schedule:
    - cron: '*/5 * * * *' # Runs every 5 minutes (GitHub's minimum allowed interval)
  workflow_dispatch: # Allows you to trigger it manually anytime from the GitHub website

permissions:
  contents: write

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run Scraper Script
        run: node scraper.js # This will be the script that generates txhs-scores.json

      - name: Commit and push if changed
        run: |
          git config --global user.name 'GitHub Actions Bot'
          git config --global user.email 'actions@github.com'
          git add txhs-scores.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update TX HS scores [skip ci]" && git push)
