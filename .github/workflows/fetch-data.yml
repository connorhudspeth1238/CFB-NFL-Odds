name: Fetch ESPN Odds Data

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch CFB and NFL Data
        run: |
          curl -s "https://site.api.espn.com/apis/site/v2/sports/football/college-football/scoreboard?groups=80&limit=1000" -o cfb.json
          curl -s "https://site.api.espn.com/apis/site/v2/sports/football/college-football/scoreboard?groups=81&limit=1000" -o cfb-81.json
          curl -s "https://site.api.espn.com/apis/site/v2/sports/football/college-football/scoreboard?groups=1&limit=1000" -o cfb-1.json
          curl -s "https://site.api.espn.com/apis/site/v2/sports/football/college-football/scoreboard?groups=4&limit=1000" -o cfb-4.json
          curl -s "https://site.api.espn.com/apis/site/v2/sports/football/college-football/scoreboard?groups=5&limit=1000" -o cfb-5.json
          curl -s "https://site.api.espn.com/apis/site/v2/sports/football/college-football/scoreboard?groups=9&limit=1000" -o cfb-9.json
          curl -s "https://site.api.espn.com/apis/site/v2/sports/football/college-football/scoreboard?groups=12&limit=1000" -o cfb-12.json
          curl -s "https://site.api.espn.com/apis/site/v2/sports/football/college-football/scoreboard?groups=15&limit=1000" -o cfb-15.json
          curl -s "https://site.api.espn.com/apis/site/v2/sports/football/college-football/scoreboard?groups=17&limit=1000" -o cfb-17.json
          curl -s "https://site.api.espn.com/apis/site/v2/sports/football/college-football/scoreboard?groups=18&limit=1000" -o cfb-18.json
          curl -s "https://site.api.espn.com/apis/site/v2/sports/football/college-football/scoreboard?groups=37&limit=1000" -o cfb-37.json
          curl -s "https://site.api.espn.com/apis/site/v2/sports/football/college-football/scoreboard?groups=20&limit=1000" -o cfb-20.json
          curl -s "https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard?limit=1000" -o nfl.json

      - name: Commit & Push JSON
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add *.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Increase ESPN API limit to capture full weekend slate" && git push)
