name: Fetch ESPN Odds Data

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch CFB and NFL Data
        run: |
          # Download FBS and NFL schedules with speed optimizations and strict timeouts
          curl -s --connect-timeout 10 --max-time 30 "https://site.api.espn.com/apis/site/v2/sports/football/college-football/scoreboard?groups=80&limit=150" -o cfb.json
          curl -s --connect-timeout 10 --max-time 30 "https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard?limit=50" -o nfl.json

      - name: Commit & Push JSON
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add *.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Optimize CFB data fetch" && git push)
