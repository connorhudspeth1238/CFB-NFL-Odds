<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Football Odds & TV Schedule</title>
  <link rel="stylesheet" href="style.css?v=2000">
</head>
<body>

  <header class="no-print">
    <h1 id="page-title">College Football Scoreboard</h1>
    <button onclick="window.print()">Print / Save PDF</button>
  </header>

  <div class="tabs-container no-print">
    <button id="tab-cfb" class="tab-btn active" onclick="switchLeague('cfb')">College Football</button>
    <button id="tab-nfl" class="tab-btn" onclick="switchLeague('nfl')">NFL</button>
  </div>

  <div id="scoreboard-grid" class="scoreboard-grid"></div>

  <script src="app.js?v=2000"></script>
</body>
</html>
